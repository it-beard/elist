name: Абнаўленне спісу і публікацыя

on:
  schedule:
    - cron: '17 4 * * *'    # штодня 04:17 UTC
    - cron: '17 16 * * *'   # дубль 16:17 UTC — на выпадак, калі GitHub прапусціць ранішні
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Даслаць пробнае паведамленне ў Telegram (праверка бота)'
        type: boolean
        default: false
      force:
        description: 'Прыняць абнаўленне, нават калі новых запісаў падазрона шмат (UPDATE_FORCE=1)'
        type: boolean
        default: false
      # Пералік КДБ уручную: адрас файла «Перечень.xlsx» (напрыклад, укладанне ў GitHub issue — перацягніце файл у каментар
      # і скапіюйце спасылку) і дата версіі з паста ў канале. Іншы шлях без запуску ўручную — тэчка inbox/terror/ (джоб inbox).
      terror_url:
        description: 'Пералік КДБ: адрас файла Перечень.xlsx (напрыклад, укладанне ў issue) — разабраць і дадаць у базу'
        type: string
        default: ''
      terror_date:
        description: 'Пералік КДБ: дата версіі з паста ў канале, напрыклад 11.09.2026 (без яе — дата захавання файла)'
        type: string
        default: ''
  push:
    branches: [main]

# Правы токена — толькі тыя, што патрэбныя канкрэтнаму джобу (зададзеныя ніжэй).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

# Дзеянні прыпінутыя да SHA каміта (Dependabot абнаўляе іх PR'амі): тэг можна перапісаць, каміт — не.
jobs:
  update:
    name: Абнавіць базу
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    timeout-minutes: 55   # горшы выпадак: матэрыялы да ~20 хв, фарміраванні ~3, крок фізічных асоб да 25 (свой ліміт ніжэй), пералік КДБ і вышук РФ да 5 кожны, без запасу на вячэрнім запуску
    permissions:
      contents: write   # каміт data/ у main
    steps:
      # Токен не застаецца ў .git/config: разбор чужога .doc і npm ідуць без крэдэнцыялаў,
      # push робіцца асобным крокам праз x-access-token.
      # ref: main — каб паўторны запуск (re-run) браў актуальны main, а не каміт першай спробы:
      # інакш яго data/ канфліктуе з тым, што першая спроба ўжо запушыла.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      # Толькі runtime-залежнасці і без install-скрыптоў: у джобе з правамі на запіс — мінімум чужога кода.
      - run: npm ci --omit=dev --ignore-scripts
      - name: Спампаваць і разабраць свежы .doc
        run: npm run update
        env:
          UPDATE_FORCE: ${{ inputs.force }}
      # Другі спіс — пералік экстрэмісцкіх фарміраванняў (МУС/КДБ, .xlsx): раз на суткі (ранішні cron, ручны запуск
      # і паўторы; вячэрні cron яго прапускае — але пасля канфлікту каміта ніжэй ён бяжыць зноў безумоўна, у любым
      # запуску). Збой гэтай крыніцы не спыняе абнаўленне матэрыялаў і дэплой: і сеткавыя памылкі, і засцярогі скрыпт
      # сам піша ў formations-meta.json як sourceError (сайт папярэдзіць, alert.mjs source скажа адміну).
      - name: Абнавіць пералік экстрэмісцкіх фарміраванняў (раз на суткі)
        id: formations
        if: github.event.schedule != '17 16 * * *'
        continue-on-error: true
        run: npm run update:formations
        env:
          UPDATE_FORCE: ${{ inputs.force }}
      # Трэці спіс — пералік фізічных асоб (МУС, некалькі .doc на той жа старонцы). Апошняя частка дапаўняецца амаль
      # штотыдня, таму правяраем пры кожным запуску. Файлы вялікія (~20 МБ разам), сервер МУС часам абрывае спампоўку —
      # скрыпт паўтарае спробы сам у межах 18 хвілін; любы збой (крыніца, фармат, засцярогі) не спыняе дэплой:
      # sourceError у persons-meta.json, сайт папярэдзіць, alert.mjs source скажа адміну. Ліміт кроку — на выпадак завісання
      # (тады меты не будзе — пра гэта alert.mjs source даведаецца з выніку кроку, PERSONS_STEP).
      - name: Абнавіць пералік фізічных асоб (МУС)
        id: persons
        continue-on-error: true
        timeout-minutes: 25
        run: npm run update:persons
        env:
          UPDATE_FORCE: ${{ inputs.force }}
      # Пералік КДБ «датычных да тэрарыстычнай дзейнасці» (фізічныя асобы; на сайце — у спісе асоб). Сайт КДБ з-за мяжы не
      # адказвае, файл «Перечень.xlsx» КДБ публікуе ў сваім Telegram-канале: скрыпт бярэ яго праз карыстальніцкі акаўнт Telegram
      # (сакрэты TELEGRAM_API_ID / TELEGRAM_API_HASH / TELEGRAM_SESSION і пакет `telegram` у залежнасцях), з файлаў, якія адмін
      # пераслаў боту ў асабісты чат (TELEGRAM_BOT_TOKEN + TELEGRAM_ADMIN_CHAT_ID), ці па прамым адрасе TERROR_SOURCE (зменная
      # рэпазіторыя / параметр запуску). Калі файла няма — глядзіць публічнае прэв’ю канала і пра новую версію піша адміну ў
      # чат са спасылкай на пост. Іншы шлях — тэчка inbox/terror/ (джоб inbox ніжэй) ці лакальны запуск
      # (node scripts/update-terror.mjs Перечень.xlsx). Збой не спыняе дэплой: sourceError у terror-meta.json, alert.mjs source.
      - name: Абнавіць пералік КДБ (тэрарыстычная дзейнасць)
        id: terror
        continue-on-error: true
        timeout-minutes: 5
        run: npm run update:terror
        env:
          UPDATE_FORCE: ${{ inputs.force }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TERROR_SOURCE: ${{ inputs.terror_url || vars.TERROR_SOURCE }}
          TERROR_DATE: ${{ inputs.terror_date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      # Чацвёрты спіс — беларусы ў базе вышуку МУС РФ паводле штодзённай выбаркі Медыязоны (адзін JSON, ~1 МБ). Правяраем пры
      # кожным запуску; збой не спыняе дэплой: sourceError у wanted-meta.json, сайт папярэдзіць, alert.mjs source скажа адміну.
      - name: Абнавіць базу вышуку РФ (Медыязона)
        id: wanted
        continue-on-error: true
        timeout-minutes: 5
        run: npm run update:wanted
        env:
          UPDATE_FORCE: ${{ inputs.force }}
      - name: Дайджэст у Telegram (калі наладжаны сакрэты)
        run: node scripts/notify.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
          SITE_URL: https://elist.itbeard.com/
      # Вынікі крокаў пералікаў МУС: крок упаў ці забіты таймаўтам да запісу меты — sourceError няма, і без гэтага
      # ніхто б не даведаўся.
      - name: Папярэдзіць адміна, калі змяніўся стан крыніцы
        if: always()
        run: node scripts/alert.mjs source
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          FORMATIONS_STEP: ${{ steps.formations.outcome }}
          PERSONS_STEP: ${{ steps.persons.outcome }}
          TERROR_STEP: ${{ steps.terror.outcome }}
          WANTED_STEP: ${{ steps.wanted.outcome }}
      # Каміт заўжды пасля дайджэсту: data/notified.json з адзнакамі пра адпраўку мусіць трапіць у рэпо,
      # інакш наступны запуск прышле тое самае паўторна. Перад push — rebase і паўторы: паралельны push
      # у main (напрыклад, ваш каміт з кодам) не павінен губляць гэты каміт і валіць дэплой.
      - name: Закамітаваць змены ў базе
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_FORCE: ${{ inputs.force }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          commit_data() { git add data; git diff --cached --quiet && return 1; git commit -q -m "data: абнаўленне спісу $(date -u +%F)"; }
          commit_data || { echo "Зменаў няма"; exit 0; }
          for i in 1 2 3; do
            git fetch -q origin main
            if git rebase -q origin/main; then
              git push -q origin HEAD:main && exit 0
              echo "Push адхілены (спроба $i), паўтараю…"
            else
              # Канфлікт у data/: базу ўжо абнавіў іншы запуск (папярэдняя спроба гэтага ж run'а, ручны push).
              # Бяром свежы main і паўтараем разбор: update.mjs ідэмпатэнтны адносна апошняй базы, а дайджэст
              # для новых запісаў дашле наступны запуск — notified.json са свежага main не губляецца.
              git rebase --abort 2>/dev/null || true
              echo "Канфлікт з origin/main у data/ (спроба $i): паўтараю абнаўленне на свежай базе…"
              git reset -q --hard origin/main
              npm run update
              npm run update:formations || true
              npm run update:persons || true
              npm run update:terror || true
              npm run update:wanted || true
              commit_data || { echo "Пасля паўтору зменаў няма"; exit 0; }
            fi
            sleep 10
          done
          echo "::error::Не ўдалося запушыць data/ пасля 3 спробаў"
          exit 1
      - name: Папярэдзіць адміна пра збой
        if: failure()
        run: node scripts/alert.mjs failed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ALERT_JOB: update
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Пералік КДБ з тэчкі inbox/terror/: уладальнік кладзе туды «Перечень.xlsx» (git push ці «Upload files» на GitHub; у назве
  # файла можа быць дата версіі з паста ў канале — 2026-09-11.xlsx ці Перечень-11.09.2026.xlsx, інакш бярэцца дата захавання
  # файла), і на push у main гэты джоб разбірае файлы па чарзе (па назве), даўносіць у data/terror.json, выдаляе іх з тэчкі,
  # дасылае дайджэст і камітуе — далей deploy публікуе сайт з новай базай. Без файлаў у тэчцы джоб нічога не робіць.
  # Збой разбору (фармат, засцярога) — файл застаецца ў тэчцы, адмін атрымае алерт.
  inbox:
    name: Разабраць файл пераліку КДБ з inbox/
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      contents: write   # каміт data/ і выдаленне разабраных файлаў
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, persist-credentials: false }
      - name: Ці ёсць файлы ў inbox/terror
        id: files
        run: |
          list=$(ls inbox/terror/*.xlsx 2>/dev/null | tr '\n' ' ' || true)
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          if [ -n "$list" ]; then echo "Файлы: $list"; else echo "У inbox/terror файлаў няма — нічога не робім."; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.files.outputs.list != ''
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev --ignore-scripts
        if: steps.files.outputs.list != ''
      - name: Разабраць і дадаць у базу
        if: steps.files.outputs.list != ''
        env:
          UPDATE_FORCE: '0'
        run: |
          for f in inbox/terror/*.xlsx; do
            # дата версіі пераліку — з назвы файла (11.09.2026 ці 2026-09-11), калі яна там ёсць
            date=$(basename "$f" .xlsx | grep -oE '[0-9]{2}\.[0-9]{2}\.[0-9]{4}|[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)
            echo "== $f (дата версіі: ${date:-з файла})"
            node scripts/update-terror.mjs "$f" $date
            git rm -q "$f"
          done
      - name: Дайджэст у Telegram (калі наладжаны сакрэты)
        if: steps.files.outputs.list != ''
        run: node scripts/notify.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_URL: https://elist.itbeard.com/
      - name: Закамітаваць базу і прыбраць разабраныя файлы
        if: steps.files.outputs.list != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data inbox
          git diff --cached --quiet && { echo "Зменаў няма"; exit 0; }
          git commit -q -m "data: пералік КДБ з inbox $(date -u +%F)"
          for i in 1 2 3; do
            git fetch -q origin main
            if git rebase -q origin/main; then
              git push -q origin HEAD:main && exit 0
              echo "Push адхілены (спроба $i), паўтараю…"
            else
              git rebase --abort 2>/dev/null || true
              echo "::error::Канфлікт з origin/main (спроба $i) — паўтарыце push файла ў inbox/terror пасля таго, як main супакоіцца"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Не ўдалося запушыць пасля 3 спробаў"
          exit 1
      - name: Папярэдзіць адміна пра збой
        if: failure()
        run: node scripts/alert.mjs failed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ALERT_JOB: inbox
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    name: Сабраць і апублікаваць
    needs: [update, inbox]
    # на push абнаўленне прапускаецца, а inbox ідзе (нават пусты); на cron/ручным запуску — наадварот
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped') && (needs.inbox.result == 'success' || needs.inbox.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Зборка (індэкс + Vite)
        run: npm run build
        env:
          # уласны дамен: сайт аддаецца з кораня
          BASE_PATH: /
          SITE_URL: https://elist.itbeard.com/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # include-hidden-files: ад v4 dot-файлы ў артэфакт не трапляюць, а нам патрэбны dist/.well-known/security.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: dist, include-hidden-files: true }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Папярэдзіць адміна пра збой
        if: failure()
        run: node scripts/alert.mjs failed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ALERT_JOB: deploy
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
