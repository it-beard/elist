name: Абнаўленне спісу і публікацыя

on:
  schedule:
    - cron: '17 4 * * *'    # штодня 04:17 UTC
    - cron: '17 16 * * *'   # дубль 16:17 UTC — на выпадак, калі GitHub прапусціць ранішні
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Даслаць пробнае паведамленне ў Telegram (праверка бота)'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    name: Абнавіць базу
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Спампаваць і разабраць свежы .doc
        run: npm run update
      - name: Дайджэст у Telegram (калі наладжаны сакрэты)
        run: node scripts/notify.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
          SITE_URL: https://elist.itbeard.com/
      # Каміт заўжды пасля дайджэсту: data/notified.json з адзнакамі пра адпраўку
      # мусіць трапіць у рэпо, інакш наступны запуск прышле тое самае паўторна.
      - name: Закамітаваць змены ў базе
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo "Зменаў няма"
          else
            git commit -m "data: абнаўленне спісу $(date -u +%F)"
            git push
          fi

  deploy:
    name: Сабраць і апублікаваць
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Зборка (індэкс + Vite)
        run: npm run build
        env:
          # уласны дамен: сайт аддаецца з кораня
          BASE_PATH: /
          SITE_URL: https://elist.itbeard.com/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
